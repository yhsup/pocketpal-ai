name: Build Android APK (HF mirror)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把「改好的完整源文件」解压覆盖到仓库，镜像逻辑才能在运行时真正生效。
      # 注意：hf-mirror-files.zip 需要随本仓库一起提交（放在仓库根目录）。
      # 该 zip 由本地用 zip 打包 12 个文件得到（相对路径），解压即覆盖同名文件。
      - name: Apply HF mirror source overrides
        run: unzip -o hf-mirror-files.zip -d .

      # 官方 release 会先清掉这些占用空间的东西，源码编译 llama.rn 很吃磁盘；
      # 预编译 jniLibs 路径下也建议保留，避免后续步骤磁盘不足。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.21.0'
          cache: yarn

      # 把 HF 下载域名切到国内镜像。要换别的镜像改这一行即可。
      - name: Create .env (HF mirror + required keys)
        run: |
          cat > .env <<'EOL'
          HF_MIRROR_URL=https://hf-mirror.com

          FIREBASE_FUNCTIONS_URL=
          SUPABASE_URL=https://your-project.supabase.co
          SUPABASE_ANON_KEY=your-anon-key
          PALSHUB_API_BASE_URL=https://palshub.ai
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=
          GOOGLE_WEB_CLIENT_ID=
          EOL

      # google-services.json 不在仓库里，但构建强制需要。这里放一个占位文件，
      # 让 google-services 插件通过；Firebase 相关功能不可用，但能编译安装。
      # 想用真实 Firebase，把下面 heredoc 换成你自己的文件内容即可。
      - name: Create stub google-services.json
        run: |
          cat > android/app/google-services.json <<'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-mirror",
              "storage_bucket": "pocketpal-mirror.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.pocketpalai" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOL

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 不设置 RNLLAMA_SKIP_POSTINSTALL → llama.rn 下载预编译 jniLibs，省去 NDK 编译。
      - name: Build APK (prodDebug)
        working-directory: android
        run: ./gradlew assembleProdDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-android-apk
          path: android/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error

